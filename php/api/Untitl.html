    <script type="text/javascript">
        // Handel EducationLevel & Referral
        var $country = $('#country');

        // RUN when country change
        $country.on('input', function (e) {
            var countryId = $(this).val();
            getCommonDataRequest('get_education_levels', 'education_level', countryId);
            getCommonDataRequest('get_jobseeker_referrals', 'referral',  countryId);
        });

        function getCommonDataRequest(dataURL, selectorId, countryId) {
            $.ajax({
                type: 'POST',
                url: site_url('common/' + dataURL + '/' + countryId),
                dataType: "json",
                success: function (educationLevels) {
                    renderSelectList(selectorId, educationLevels);
                }
            });
        }

        function renderSelectList(selectorId, dataList) {
            var $outputList = $("#" + selectorId);

            $outputList
                .empty()
                .append(new Option('--اختر--', ''));

            $.each(dataList, function(key, val) {
                $outputList
                    .append(new Option(val, key));
            });
        }
        
        // mobile validation for Egypt
        $('#mobile').on('blur', function (e) {
            var phoneValue = e.target.value;
            var country = $('#country').val();
            var mobileWrapper = $("#wrapper_mobile");
            var mobileRow = $('#row_mobile');
            if(phoneValue.length == 0) {
                $('#mobileStatus').hide();
                mobileRow.addClass('has-error');
                mobileWrapper.append("<span id='mobileStatus' for='mobile' class='msg'>برجاء ادخال رقم هاتف صحيح</span>");
            } else if (country == "1" && phoneValue.length < 11) {
                $('#mobileStatus').hide();
                mobileRow.addClass('has-error');
                mobileWrapper.append("<span id='mobileStatus' for='mobile' class='msg'>برجاء ادخال 11 رقم</span>");
            } else {
                mobileRow.removeClass('has-error');
                $('#mobileStatus').hide();
            }
        });

        var isDirectedFromCovid19 = window.location.search.indexOf("tag=c19") !== -1;
        var ministryOfPlanningId = "59";
        if(isDirectedFromCovid19) {
            $("#referral").val(ministryOfPlanningId);
        }

    </script>
