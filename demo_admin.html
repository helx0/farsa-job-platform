<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة - فرصة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --accent: #f093fb;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7ff 0%, #f0e6ff 50%, #ffe6f0 100%);
            color: #2d3436;
            overflow-x: hidden;
        }

        /* ==================== TOP NAVBAR ==================== */
        .top-navbar {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(240, 147, 251, 0.05) 100%);
            padding: 15px 30px;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.15);
            border: 2px solid rgba(102, 126, 234, 0.1);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 20px;
            z-index: 100;
        }

        .navbar-right {
            display: flex;
            align-items: center;
            margin-left: auto;
        }

        .navbar-menu-item {
            position: relative;
            padding: 21px;
        }

        .user-menu-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            color: rgba(183, 102, 220, 0.95);
            padding: 14px 20px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.08) 100%);
            border: 2px solid rgba(255, 255, 255, 0.25);
            font-size: 0.95rem;
            font-weight: 600;
            backdrop-filter: blur(15px);
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.15);
        }

        .user-menu-btn:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0.15) 100%);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.25);
            color: white;
        }

        .dropdown-menu {
            position: absolute;
            top: calc(100% + 15px);
            right: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.98) 0%, rgba(255, 255, 255, 0.95) 100%);
            min-width: 300px;
            border-radius: 24px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.15);
            display: none;
            flex-direction: column;
            z-index: 1001;
            overflow: hidden;
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .dropdown-menu.show {
            display: flex;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 24px 24px 16px;
            border-bottom: 2px solid rgba(102, 126, 234, 0.1);
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05) 0%, rgba(118, 75, 162, 0.03) 100%);
        }

        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .user-details {
            flex: 1;
            text-align: right;
        }

        .user-name {
            font-weight: 700;
            font-size: 1.1rem;
            color: #2d3748;
            margin-bottom: 4px;
        }

        .user-role {
            font-size: 0.85rem;
            color: #718096;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dropdown-item {
            padding: 18px 24px;
            color: #4a5568;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 16px;
            text-decoration: none;
            border-bottom: 1px solid rgba(102, 126, 234, 0.08);
        }

        .dropdown-item:hover {
            color: #667eea;
            transform: translateX(-8px);
            padding-left: 32px;
        }

        /* ==================== MAIN CONTENT ==================== */
        .main-content {
            padding: 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(240, 147, 251, 0.05) 100%);
            padding: 25px 30px;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.15);
            border: 2px solid rgba(102, 126, 234, 0.1);
            backdrop-filter: blur(10px);
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-icon {
            background: rgba(102, 126, 234, 0.1);
            color: #667eea;
            border: 2px solid #667eea;
            width: 48px;
            height: 48px;
            padding: 0;
            justify-content: center;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.7) 100%);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.1);
            border: 2px solid rgba(102, 126, 234, 0.1);
            transition: all 0.4s ease;
        }

        .stat-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 50px rgba(102, 126, 234, 0.2);
        }

        .stat-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        .stat-label {
            color: #666;
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 2.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-change {
            font-size: 0.85rem;
            color: #10b981;
            font-weight: 600;
            margin-top: 8px;
        }

        .section {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.7) 100%);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.1);
            border: 2px solid rgba(102, 126, 234, 0.1);
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- TOP NAVBAR -->
        <nav class="top-navbar">
            <div class="navbar-left"></div>
            <div class="navbar-right">
                <div class="navbar-menu-item">
                    <button class="user-menu-btn" onclick="toggleUserMenu()">
                        <i class="fas fa-user-shield"></i>
                        <span>المسؤول</span>
                        <i class="fas fa-chevron-down"></i>
                    </button>
                    <div class="dropdown-menu" id="userMenu">
                        <div class="user-info">
                            <div class="user-avatar">👨‍💼</div>
                            <div class="user-details">
                                <div class="user-name">أحمد أمين</div>
                                <div class="user-role">
                                    <i class="fas fa-shield-alt"></i>
                                    <span>مسؤول النظام</span>
                                </div>
                            </div>
                        </div>
                        <button class="dropdown-item">
                            <i class="fas fa-home"></i>
                            <span>نظرة عامة</span>
                        </button>
                        <button class="dropdown-item">
                            <i class="fas fa-users"></i>
                            <span>المستخدمون</span>
                        </button>
                        <button class="dropdown-item">
                            <i class="fas fa-building"></i>
                            <span>الشركات</span>
                        </button>
                        <a class="dropdown-item" href="#">
                            <i class="fas fa-sign-out-alt"></i>
                            <span>تسجيل الخروج</span>
                        </a>
                    </div>
                </div>
            </div>
        </nav>

        <!-- MAIN CONTENT -->
        <div class="main-content">
            <!-- HEADER -->
            <div class="header">
                <h1><i class="fas fa-gauge"></i> لوحة الإدارة</h1>
                <div class="header-right">
                    <a href="#" class="btn btn-primary">
                        <i class="fas fa-cogs"></i> إعدادات
                    </a>
                    <button class="btn btn-icon">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
            </div>

            <!-- STATS -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">👥</div>
                    <div class="stat-label">إجمالي المستخدمين</div>
                    <div class="stat-value">1,234</div>
                    <div class="stat-change">
                        <i class="fas fa-arrow-up"></i> +56 هذا الأسبوع
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🏢</div>
                    <div class="stat-label">عدد الشركات</div>
                    <div class="stat-value">89</div>
                    <div class="stat-change">
                        <i class="fas fa-arrow-up"></i> +5 جديد
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">💼</div>
                    <div class="stat-label">الوظائف المنشورة</div>
                    <div class="stat-value">456</div>
                    <div class="stat-change">
                        <i class="fas fa-arrow-up"></i> +23 هذا الشهر
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">📊</div>
                    <div class="stat-label">معدل التفاعل</div>
                    <div class="stat-value">78%</div>
                    <div class="stat-change">
                        <i class="fas fa-arrow-up"></i> +8% عن السابق
                    </div>
                </div>
            </div>

            <!-- SECTION -->
            <div class="section">
                <h2 class="section-title">
                    <i class="fas fa-history"></i>
                    آخر المستخدمين المسجلين
                </h2>
            </div>
        </div>
    </div>

    <script>
        function toggleUserMenu() {
            document.getElementById('userMenu').classList.toggle('show');
        }

        document.addEventListener('click', (e) => {
            const userMenu = document.getElementById('userMenu');
            const userMenuBtn = document.querySelector('.user-menu-btn');
            if (userMenu && userMenuBtn && !userMenuBtn.contains(e.target) && !userMenu.contains(e.target)) {
                userMenu.classList.remove('show');
            }
        });
    </script>
</body>
</html>
